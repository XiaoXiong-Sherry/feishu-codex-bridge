[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = ">=3.10"

[pypi-dependencies]
lark-channel-sdk = "*"
openai-codex = "*"
socksio = "*"

[tasks]
start = "bash start.sh start"
stop = "bash start.sh stop"
status = "bash start.sh status"
test = "python -m unittest discover -s tests -v"
